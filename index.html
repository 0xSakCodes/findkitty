<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Kitty :)</title>

    <!-- loading font-family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pangolin:wght@300;400&display=swap" rel="stylesheet">

    <style>
      /* styling! */
      body {
        margin: 0;
        font-family: 'Pangolin', monospace;
        background: linear-gradient(120deg, #ffdde1, #ee9ca7);
        overflow: hidden;
        min-height: 100vh;
        color: #fff;
      }

      h1 {
        text-align: center;
        font-size: 3rem;
        margin-top: 30px;
        background: linear-gradient(90deg, #ff4fd8, #7c4dff, #00e5ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* containers */
      .mascot-container,
      .cards{
        position: relative;
        z-index: 5;
      }

      .mascot-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        position: relative;
      }
      .mascot {
        width: 170px;
        cursor: pointer;
        animation: bounce 2s infinite;
      }

      /* bounce animation */
      @keyframes bounce {
        0%, 100%{transform:translateY(0)}
        50%{transform:translateY(-15px)}
      }

      /* speech */
      speech {
        position: absolute;
        bottom: 150px;
        background: #fff;
        color: #000;
        padding: 8px 12px;
        border-radius: 12px;
      }

      /* cards */
      .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top:40px;
      }
      .card {
        width: 140px;
        height: 140px;
        background: #fff;
        color: #000;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .card:hover {
        transform:scale(1.1) rotate(6deg);
      }

      /* effects: */
      .kitty, .confetti, .bubble {
        position: absolute;
        pointer-events: none;
      }
      .kitty {
        font-size: 24px;
        animation: kitty 5s linear forwards;
      }
      /* kitty animation */
      @keyframes kitty {
        0%{transform:translateY(0)}
        100%{transform:translateY(-120vh);opacity:0}
      }

      .confetti {
        width: 10px;
        height: 10px;
        border-raidus: 3px;
      }
      
      /* bubble */
      .bubble {
        position: absolute;
        bottom: -50px;
        background: rgba(255, 255, 255, 0.2);
        border-raidus: 50%;
        animation: floatUp 6s linear forwards;
      }
      /* floatUp animation */
      @keyframes floatUp {
        from {transform:translateY(0); opacity: 0.8}
        to {transform:translateY(-120vh); opacity: 0}
      }
    </style>
  </head>
  <body>
    <h1>Find Kitty 😼</h1>

    <div class="mascot-container">
      <img class="mascot" src="./images/cat-kitty1.png">
      <div class="speech">Find & Tap Kitty! 😼</div>
    </div>

    <div class="cards">
      <div class="card">👾 I'm Kitty!</div>
      <div class="card">😼 Am I?</div>
      <div class="card">🦄 Not Me?</div>
      <div class="card">👽 Uhm :)</div>
    </div>

    <div class="fake-win" id="fakeWin">
      <img class="win-img" src="">
      <div class="big-text">No Way!! You Found Me?! 🎉🙀</div>
    </div>
    <div class="real-win" id="realWin">
      <img class="win-img" src="">
      <div class="big-text">Oh YaY! You Really Found Me!:) 🎉😼</div>
    </div>
    
    <!-- scriptings: -->
    <script src="index.js"></script>
  </body>
</html>
