<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Kitty :)</title>

    <!-- loading font-family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Flamenco:wght@300;400&display=swap" rel="stylesheet">

    <style>
      /* styling! */
      body {
        margin: 0;
        font-family: 'Flamenco', monospace;
        background: linear-gradient(120deg, #ffdde1, #ee9ca7);
        overflow: hidden;
        min-height: 100vh;
        color: #fff;
      }

      h1 {
        text-align: center;
        font-size: 3rem;
        margin-top: 30px;
        background: linear-gradient(90deg, #ff4fd8, #7c4dff, #00e5ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* containers */
    </style>
  </head>
  <body>
    <h1>Find Kitty 😼</h1>

    <div class="mascot-container">
      <img class="mascot" src="">
      <div class="speech">Find & Tap Kitty! 😼</div>
    </div>

    <div class="cards">
      <div class="card">👾 I'm Kitty!</div>
      <div class="card">😼 Am I?</div>
      <div class="card">🦄 Not Me?</div>
      <div class="card">👽 Uhm :)</div>
    </div>

    <div class="fake-win" id="fakeWin">
      <img class="win-img" src="">
      <div class="big-text">No Way!! You Found Me?! 🎉🙀</div>
    </div>
    <div class="real-win" id="realWin">
      <img class="win-img" src="">
      <div class="big-text">Oh YaY! You Really Found Me!:) 🎉😼</div>
    </div>
    
    <!-- scriptings: -->
    <script src="index.js"></script>
  </body>
</html>
